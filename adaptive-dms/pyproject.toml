[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-dms"
version = "0.1.0"
description = "Edge-first adaptive driver-monitoring system"
requires-python = ">=3.11,<3.13"
dependencies = [
  "h5py>=3.10",
  "mediapipe>=0.10.21",
  "numpy>=1.26",
  "opencv-python>=4.10",
  "pydantic>=2.10",
  "torch>=2.5",
]

[project.optional-dependencies]
train = [
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "pandas>=2.2",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
